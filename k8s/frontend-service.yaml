apiVersion: v1
kind: Service
metadata:
  name: finconvert-frontend-service
spec:
  # NodePort exposes the service to the outside world
  type: NodePort
  selector:
    app: finconvert-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    # K8s will open a port on the host machine between 30000-32767
    nodePort: 30080